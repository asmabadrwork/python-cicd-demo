name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. CI / SAST / Test / Docker Build & Push (Shared Workflow)
  python-ci:
    uses: vishuops0210/shared-repo/.github/workflows/ci-python.yml@main
    with:
      python-version: "3.12"
      enable-gitleaks: true
      enable-unit-tests: true
      install-command: "pip install pytest pytest-cov && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi"
      test-command: "pytest tests/ --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml"
      sonar-project-key: "python-cicd-demo"
      sonar-exclusions: "venv/**,__pycache__/**,.github/**"
      sonar-args: "-Dsonar.sources=app.py -Dsonar.tests=tests -Dsonar.python.coverage.reportPaths=coverage.xml -Dsonar.python.xunit.reportPath=test-results.xml"
      docker-repository: "python-cicd-demo"
      docker-tag: ${{ github.sha }}
      max-image-size-mb: "500"
    secrets: inherit

  # 2. Deploy to EC2
  deploy:
    needs: python-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull asmabadrwork/python-cicd-demo:${{ github.sha }}
            docker stop flask-app || true
            docker rm flask-app || true
            docker run -d --restart always --name flask-app -p 5000:5000 asmabadrwork/python-cicd-demo:${{ github.sha }}

  # 3. Retag & Push to ECR (Without Rebuilding!)
  push-to-ecr:
    needs: python-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull from Docker Hub & Push to ECR
        run: |
          DOCKER_HUB_IMAGE="asmabadrwork/python-cicd-demo:${{ github.sha }}"
          ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/python-cicd-demo:${{ github.sha }}"
          
          docker pull $DOCKER_HUB_IMAGE
          docker tag $DOCKER_HUB_IMAGE $ECR_IMAGE
          docker push $ECR_IMAGE
